name: Bug report
description: Report a reproducible problem in Aurex.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the scenario configuration, seed, and engine version when relevant. Do not attach secrets or private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Node, compiler, browser
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
