name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Build engine and run C++ tests
        run: ./scripts/build-engine.sh
      - name: Run integration tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check headless example
        run: |
          ./build/aurex-engine --run < examples/balanced.json > /tmp/aurex-result.json
          python -c 'import json; s=json.load(open("/tmp/aurex-result.json")); assert s["done"] and s["tradeCount"] > 0'
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Type-check and build frontend
        run: npm --prefix web run build
